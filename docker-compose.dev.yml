# 开发环境一键启动
# 使用方法: docker compose -f docker-compose.dev.yml up -d

services:
  mongodb:
    image: mongo:7.0
    container_name: stock-mongo-dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - stock-dev-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: stock-server-dev
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/stock_db
      MONGODB_DATABASE: stock_db
      GIN_MODE: debug
    volumes:
      - ./server:/app
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - stock-dev-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: stock-web-dev
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - stock-dev-network

volumes:
  mongodb_dev_data:

networks:
  stock-dev-network:
    driver: bridge
