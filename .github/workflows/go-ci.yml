name: Go
on: [push]

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: stock-project
  SERVER_IMAGE: stock-server
  WEB_IMAGE: stock-web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
      - name: Install dependencies
        working-directory: ./server
        run: go get .
      - name: Build
        working-directory: ./server
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ./server-go

      - name: Deploy whole project with docker-compose
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: '-avzr --delete'
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: "/stock-project"
          SCRIPT_BEFORE: |
            echo "Stopping and removing existing containers..."
            cd /stock-project || mkdir -p /stock-project
            sudo docker compose down || true
          SCRIPT_AFTER: |
            echo "Starting services with docker compose..."
            cd /stock-project
            sudo docker compose up -d
            sleep 5
            echo "Checking service status..."
            sudo docker compose ps
            echo "All services deployed successfully"

      - name: Deploy to aliyun server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: '-avzr'
          SOURCE: "./server/server-go"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: "/server-go"
          SCRIPT_AFTER: |
            echo "Backup server binary (legacy deployment step)"
            cd /stock-project
            cp ./server/server-go /server-go-backup || true