version: '3.8'

# 生产环境配置：使用本地已加载的镜像
# 部署流程：
# 1. 从 CI/CD 上传的 tar 文件加载镜像：docker load -i /tmp/stock-server.tar && docker load -i /tmp/stock-web.tar
# 2. 启动服务：docker compose -f docker-compose.prod.yml up -d

services:
  mongodb:
    image: mongo:7.0
    container_name: stock-mongodb
    restart: unless-stopped
    # 不映射端口到主机，只在 Docker 网络内访问
    # ports:
    #   - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: stock_db
    volumes:
      - mongodb_data:/data/db
      - ./db/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: stock-server:latest
    container_name: stock-server
    restart: unless-stopped
    # 不映射端口到主机，只在 Docker 网络内访问（通过 web 容器的 nginx 代理）
    # ports:
    #   - "8080:8080"
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-stockuser}:${MONGO_PASSWORD:-stockpass}@mongodb:27017/stock_db?authSource=stock_db
      MONGODB_DATABASE: stock_db
      GIN_MODE: release
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - stock-network

  web:
    image: stock-web:latest
    container_name: stock-web
    restart: unless-stopped
    # 映射端口到主机，供外部 nginx 反向代理访问
    # 外部 nginx 通过 localhost:3000 访问 web 容器
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - stock-network

volumes:
  mongodb_data:

networks:
  stock-network:
    driver: bridge

